server:
  port: 8081

spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: attendance_db

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
    cache-names:
      - studentAnalytics
      - subjectStats
      - weatherData
      - subjects
      - users
      - attendancePercentage
  
  # File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
  
  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: siddhant.prasad8@gmail.com
    password: rmid ucgg iygr vive 
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  email:
    from: your-email@gmail.com
    attendance-threshold: 75.0
  
  # Rate Limiting Configuration
  rate-limit:
    enabled: false  # Temporarily disabled for troubleshooting
    capacity: 100
    refill-tokens: 100
    refill-duration-minutes: 1
  # Weather API Configuration (Open-Meteo)
  weather:
    geocoding-url: https://geocoding-api.open-meteo.com/v1/search
    forecast-url: https://api.open-meteo.com/v1/forecast
  
  # Cache Configuration
  cache:
    enabled: true
    default-ttl-minutes: 10
    stats-enabled: true



management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  metrics:
    enable:
      cache: true

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.security: DEBUG
    spring_masters.attendance_system: DEBUG
    org.springframework.cache: DEBUG